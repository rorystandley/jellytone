name: Jellytone
options:
  bundleIdPrefix: org.example.jellytone
  deploymentTarget:
    iOS: "18.4"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
    DEVELOPMENT_TEAM: "$(APP_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  Jellytone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - Domain
      - JellyfinGateway
      - LibraryStore
      - Playback
      - Features
      - DesignSystem
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: Jellytone
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  JellytoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppTests
      - path: Tests/Fixtures/Jellyfin/Phase3
        buildPhase: resources
    dependencies:
      - target: Jellytone
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"
  JellytoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/AppUITests
    dependencies:
      - target: Jellytone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).uitests"
schemes:
  Jellytone:
    build:
      targets:
        Jellytone: all
        JellytoneTests: [test]
    test:
      targets:
        - JellytoneTests
  JellytoneUI:
    build:
      targets:
        Jellytone: all
        JellytoneUITests: [test]
    test:
      targets:
        - JellytoneUITests
