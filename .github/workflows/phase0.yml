name: Repository validation

# Private repo; macos-hosted gates are expensive.
# Verify locally (tools/phase0/validate.sh, ./scripts/test.sh,
# ./scripts/test-ui.sh, ./scripts/test-integration.sh, ./scripts/build-release.sh).
# Dispatch this workflow only when a hosted check is wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-frameworks:
    name: Phase 0 Apple frameworks and simulator gate
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install portable Phase 0 prerequisites
        run: brew install ffmpeg shellcheck
      - name: Record proof-lab prerequisite versions
        run: |
          ffmpeg -version | head -1
          shellcheck --version
      - name: Run shared and Apple-hosted validation
        run: tools/phase0/validate.sh apple
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  linux-container-contracts:
    name: Phase 0 Linux containers, network lab, and live contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install portable Phase 0 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jq shellcheck uuid-runtime
      - name: Record proof-lab prerequisite versions
        run: |
          ffmpeg -version | head -1
          shellcheck --version
      - name: Prove Docker daemon availability
        run: docker info
      - name: Run shared and Linux container validation
        run: tools/phase0/validate.sh linux
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  app-unit-tests:
    name: Application unit and simulator tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run authoritative application test gate
        run: ./scripts/test.sh
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  app-ui-tests:
    name: Application UI and lifecycle tests (${{ matrix.suite.name }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Connection, browse, and downloads
            tests: JellytoneUITests/ConnectionScreenUITests,JellytoneUITests/BrowseDestinationUITests,JellytoneUITests/DownloadsUITests
          - name: Favourites, genres, and catalogue
            tests: JellytoneUITests/FavouritesUITests,JellytoneUITests/GenreUITests,JellytoneUITests/TrackCatalogUITests
          - name: Home and playlists
            tests: JellytoneUITests/HomeUITests,JellytoneUITests/PlaylistUITests
    env:
      JELLYFIN_TEST_ONLY: ${{ matrix.suite.tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run authoritative UI test gate
        run: ./scripts/test-ui.sh
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  app-live-integration:
    name: Application integration against disposable Jellyfin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jq uuid-runtime
      - name: Prove Docker daemon availability
        run: docker info
      - name: Run authoritative production-path integration gate
        run: ./scripts/test-integration.sh
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  app-release-build:
    name: Unsigned Release simulator build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run authoritative release build gate
        run: ./scripts/build-release.sh
      - name: Reject generated-artifact drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
